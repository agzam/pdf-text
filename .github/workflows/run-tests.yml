---
name: Run Tests

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # check-parens, byte-compile, checkdoc and the buttercup suites.  The
  # corpus cases render captured geometry, so no PDF and no epdfinfo are
  # needed here; network only on a cold elpa cache (one buttercup install).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        emacs-version: ['29.4', '31.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      - name: Cache test deps
        uses: actions/cache@v4
        with:
          path: .local/elpa
          key: elpa-${{ runner.os }}-${{ matrix.emacs-version }}-${{ hashFiles('bb.edn') }}
      - run: bb ci
